<style>
body { margin:0; padding:16px; background:#0d0d0d; font-family:'Segoe UI',system-ui,sans-serif; display:flex; justify-content:center; }
.container { max-width:860px; width:100%; }
svg text { user-select:none; }
.dot { cursor:pointer; transition:filter 0.15s; }
.dot:hover { filter:brightness(1.6); }
.grid-line { stroke:#1e1e1e; stroke-width:1; stroke-dasharray:4 3; }
.zero-line { stroke:#555; stroke-width:1; }
.qlabel { fill:#555; font-size:10px; font-style:italic; }
/* Pestañas */
.tabs { display:flex; gap:6px; margin:0 0 10px; border-bottom:1px solid #1e1e1e; }
.tab { appearance:none; background:transparent; border:none; cursor:pointer;
  color:#888; font-family:inherit; font-size:13px; font-weight:600;
  padding:9px 16px 10px; border-bottom:2px solid transparent; margin-bottom:-1px;
  transition:color .15s; }
.tab:hover { color:#ddd; }
.tab.active { color:#f0f0f0; }
#tooltip {
  position:fixed; display:none;
  background:#1a1a1a; border:1px solid #333;
  border-radius:8px; padding:10px 14px;
  pointer-events:none; z-index:100; min-width:170px;
}
#tooltip .tt { font-size:15px; font-weight:bold; color:#f0f0f0; margin-bottom:2px; }
#tooltip .tn { font-size:11px; color:#888; margin-bottom:7px; }
#tooltip .tr { font-size:12px; color:#ccc; margin:2px 0; }
#tooltip .pos { color:#4ade80; }
#tooltip .neg { color:#f87171; }
/* Sección 2 — Noticias de la semana */
.news-section { margin:30px auto 6px; }
.news-h { color:#f0f0f0; font-size:15px; font-weight:700; margin:0 0 3px; }
.news-sub { color:#777; font-size:11px; margin:0 0 15px; }
.news-row { display:flex; gap:12px; padding:10px 0; border-top:1px solid #1e1e1e; align-items:baseline; }
.news-row:first-of-type { border-top:none; }
.news-tk { flex:0 0 96px; font-weight:700; font-size:13px; color:#f0f0f0; }
.news-tk .wc { display:block; font-size:11px; font-weight:600; margin-top:2px; }
.news-tx { flex:1; color:#cfcfcf; font-size:12.5px; line-height:1.5; }
.news-tx strong { color:#f0f0f0; font-weight:700; }
.news-src { color:#666; font-size:10.5px; margin-top:14px; font-style:italic; }
.pos { color:#4ade80; } .neg { color:#f87171; }
/* Sección 3 — Listados de potencial (V2.1) */
.lists-section { display:flex; gap:22px; flex-wrap:wrap; margin:34px auto 10px; }
.lst { flex:1 1 320px; min-width:0; }
.lst-h { color:#f0f0f0; font-size:14px; font-weight:700; margin:0 0 2px; }
.lst-h .dotmark { display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:7px; vertical-align:middle; }
.lst-crit { color:#6b6b6b; font-size:10.5px; margin:0 0 9px; }
.lst table { width:100%; border-collapse:collapse; }
.lst th { color:#777; font-size:10px; font-weight:600; text-align:right; padding:0 0 5px; border-bottom:1px solid #222; text-transform:uppercase; letter-spacing:.03em; }
.lst th:first-child { text-align:left; }
.lst td { font-size:12px; color:#cfcfcf; padding:6px 0; text-align:right; border-bottom:1px solid #161616; white-space:nowrap; }
.lst td:first-child { text-align:left; font-weight:700; color:#f0f0f0; }
.lst tr:last-child td { border-bottom:none; }
.lst-empty { color:#666; font-size:11.5px; font-style:italic; padding:8px 0; }
</style>
</head>

3780.0,"weekChange":-0.05,"rating":"Venta","rsi":62.17,"pb":6.29,"high52":5250.0,"low52":3300.0}],
    news:null
  }
};

const TAB_ORDER = ["comprados","oportunidades","ipsa"];

/* ====================== ZONAS DE ACCIÓN (V2.1 — 19.3) ======================
   Umbrales definidos UNA sola vez. Se usan para dibujar las zonas del gráfico
   y para armar los listados de potencial. No duplicar estos números. */
const ZONES = {
  buy:  { xMax: -0.50, upMin: 25, color:'#5B8DEF', crit:'Posición en rango ≤ -50% y upside ≥ 25%' },
  sell: { xMin:  0.65, upMax:  8, color:'#8E8AA8', crit:'Posición en rango ≥ +65% y upside ≤ 8%'  }
};
const ZONE_LABELS = {
  comprados:     { buy:'Zona aumentar', sell:'Zona reducir',   lbuy:'Potencial de compra',  lsell:'Potencial de venta' },
  oportunidades: { buy:'Zona entrar',   sell:'Zona descartar', lbuy:'Potencial de entrada', lsell:'Descartar'          },
  ipsa:          { buy:'Zona aumentar', sell:'Zona reducir',   lbuy:'Potencial de compra',  lsell:'Potencial de venta' }
};

/* ====================== LAYOUT ====================== */
const W=820, H=650, ml=58, mr=20, mt=70, mb=170;
const PW = W - ml - mr;
const PH = H - mt - mb;
const FF = "'Segoe UI',system-ui,sans-serif";
const R_FIJO = 7;

const svg = document.getElementById('chart');
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent){
  const e = document.createElementNS(NS, tag);
  for (const [k,v] of Object.entries(attrs)) e.setAttribute(k, v);
  (parent || svg).appendChild(e);
  return e;
}
function tx(content, attrs, parent){
  const e = el('text', attrs, parent);
  e.textContent = content;
  return e;
}
function xNormVal(d){
  if (d.high52 == null || d.low52 == null || d.high52 <= d.low52) return 0;
  const mid = (d.high52 + d.low52) / 2;
  const half = (d.high52 - d.low52) / 2;
  return (d.price - mid) / half;
}
const xDom = [-1.12, 1.12];
function xS(v){ return ml + (v - xDom[0]) / (xDom[1] - xDom[0]) * PW; }
function lerpC(a,b,t){
  return `rgb(${Math.round(a[0]+(b[0]-a[0])*t)}, ${Math.round(a[1]+(b[1]-a[1])*t)}, ${Math.round(a[2]+(b[2]-a[2])*t)})`;
}

/* --- 19.2 Color → RSI (14), escala FIJA con clamp 30–70 --- */
const VERDE=[22,163,74], AMARILLO=[250,204,21], ROJO=[220,38,38];
function rsiColor(rsi){
  if (rsi == null || isNaN(rsi)) return 'rgb(128,128,128)';
  const c = Math.max(30, Math.min(70, rsi));
  if (c <= 50) return lerpC(VERDE, AMARILLO, (c - 30) / 20);
  return lerpC(AMARILLO, ROJO, (c - 50) / 20);
}

/* --- 19.3 Pertenencia a zonas (una sola fuente de verdad) --- */
const inBuy  = d => xNormVal(d) <= ZONES.buy.xMax  && d.upside >= ZONES.buy.upMin;
const inSell = d => xNormVal(d) >= ZONES.sell.xMin && d.upside <= ZONES.sell.upMax;

/* --- 19.4 Regresión lineal simple (OLS): upside vs xNorm --- */
function ols(DATA){
  const pts = DATA.map(d => [xNormVal(d), d.upside]).filter(p => isFinite(p[0]) && isFinite(p[1]));
  const n = pts.length;
  if (n < 2) return null;
  const mx = pts.reduce((s,p) => s+p[0], 0) / n;
  const my = pts.reduce((s,p) => s+p[1], 0) / n;
  let num = 0, den = 0;
  for (const [x,y] of pts){ num += (x-mx)*(y-my); den += (x-mx)*(x-mx); }
  if (den === 0) return null;
  const b = num / den;
  return { b, a: my - b*mx };
}

function niceTicks(min, max, n=6){
  const range = max - min;
  const step = Math.pow(10, Math.floor(Math.log10(range / n)));
  const candidates = [step, step*2, step*5, step*10];
  const chosen = candidates.find(s => range/s <= n) || candidates[candidates.length-1];
  const start = Math.ceil(min/chosen)*chosen;
  const ticks = [];
  for (let v = start; v <= max + chosen*0.01; v = Math.round((v+chosen)*1e10)/1e10) ticks.push(v);
  return ticks;
}

const fmtPct  = v => (v >= 0 ? '+' : '') + v.toFixed(2) + '%';
const fmtPos  = d => { const p = Math.round(xNormVal(d)*100); return (p > 0 ? '+' : '') + p + '%'; };

/* ====================== RENDER DEL GRÁFICO ====================== */
function renderChart(ds, key){
  const DATA = ds.data, DATE = ds.date;
  const L = ZONE_LABELS[key] || ZONE_LABELS.comprados;
  svg.innerHTML = '';

  const ys = DATA.map(d => d.upside);
  const yMin = Math.min(...ys), yMax = Math.max(...ys);
  const yPad = (yMax - yMin) * 0.18 || 1;
  const yDom = [yMin - yPad, yMax + yPad];
  const yS = v => mt + (v - yDom[0]) / (yDom[1] - yDom[0]) * PH;
  const clampY = y => Math.max(mt, Math.min(mt + PH, y));

  el('rect', { x:0, y:0, width:W, height:H, fill:'#0d0d0d' });
  const defs = el('defs', {});
  const clipEl = el('clipPath', { id:'plot' }, defs);
  el('rect', { x:ml, y:mt, width:PW, height:PH }, clipEl);

  /* --- 19.3 Zonas de acción (detrás de todo lo demás) --- */
  const zoneG = el('g', { 'clip-path':'url(#plot)' });
  // Zona de compra/aumentar: inferior izquierda
  const bx1 = ml, bx2 = xS(ZONES.buy.xMax);
  const by1 = clampY(yS(ZONES.buy.upMin)), by2 = mt + PH;
  if (bx2 > bx1 + 1 && by2 > by1 + 1){
    el('rect', { x:bx1, y:by1, width:bx2-bx1, height:by2-by1, fill:ZONES.buy.color,
      'fill-opacity':0.08, stroke:ZONES.buy.color, 'stroke-opacity':0.45,
      'stroke-width':1, 'stroke-dasharray':'5 4' }, zoneG);
    tx(L.buy, { x:bx1+8, y:mt+PH-22, fill:ZONES.buy.color, 'fill-opacity':0.85,
      'font-size':10, 'font-weight':600, 'font-family':FF }, zoneG);
  }
  // Zona de venta/reducir: superior derecha
  const sx1 = xS(ZONES.sell.xMin), sx2 = ml + PW;
  const sy1 = mt, sy2 = clampY(yS(ZONES.sell.upMax));
  if (sx2 > sx1 + 1 && sy2 > sy1 + 1){
    el('rect', { x:sx1, y:sy1, width:sx2-sx1, height:sy2-sy1, fill:ZONES.sell.color,
      'fill-opacity':0.08, stroke:ZONES.sell.color, 'stroke-opacity':0.45,
      'stroke-width':1, 'stroke-dasharray':'5 4' }, zoneG);
    tx(L.sell, { x:sx2-8, y:mt+28, fill:ZONES.sell.color, 'fill-opacity':0.85,
      'font-size':10, 'font-weight':600, 'text-anchor':'end', 'font-family':FF }, zoneG);
  }

  const xTicks = [-1, -0.75, -0.5, -0.25, 0, 0.25, 0.5, 0.75, 1];
  for (const v of xTicks){
    const x = xS(v);
    el('line', { x1:x, y1:mt, x2:x, y2:mt+PH, class:'grid-line' });
    const pct = Math.round(v*100);
    tx((pct>0?'+':'')+pct+'%', { x, y:mt+PH+16, fill:'#bbb', 'font-size':11, 'text-anchor':'middle', 'font-family':FF });
  }
  for (const v of niceTicks(yDom[0], yDom[1])){
    const y = yS(v);
    if (y < mt-1 || y > mt+PH+1) continue;
    el('line', { x1:ml, y1:y, x2:ml+PW, y2:y, class:'grid-line' });
    tx(v.toFixed(0)+'%', { x:ml-8, y:y+4, fill:'#bbb', 'font-size':11, 'text-anchor':'end', 'font-family':FF });
  }

  el('line', { x1:xS(0), y1:mt, x2:xS(0), y2:mt+PH, class:'zero-line' });
  const y0 = yS(0);
  if (y0 >= mt && y0 <= mt+PH) el('line', { x1:ml, y1:y0, x2:ml+PW, y2:y0, class:'zero-line' });

  /* --- 19.4 Línea de tendencia OLS --- */
  const fit = ols(DATA);
  if (fit){
    el('line', {
      x1: xS(xDom[0]), y1: yS(fit.a + fit.b*xDom[0]),
      x2: xS(xDom[1]), y2: yS(fit.a + fit.b*xDom[1]),
      stroke:'#cccccc', 'stroke-opacity':0.35, 'stroke-width':1.4,
      'stroke-dasharray':'6 5'
    }, el('g', { 'clip-path':'url(#plot)' }));
  }

  el('rect', { x:ml, y:mt, width:PW, height:PH, fill:'none', stroke:'#444', 'stroke-width':1 });

  tx('Bajo upside / cerca del mínimo', { x:ml+8,    y:mt+14,   class:'qlabel', 'font-family':FF });
  tx('Bajo upside / cerca del máximo', { x:ml+PW-8, y:mt+14,   class:'qlabel', 'text-anchor':'end', 'font-family':FF });
  tx('Alto upside / cerca del mínimo', { x:ml+8,    y:mt+PH-8, class:'qlabel', 'font-family':FF });
  tx('Alto upside / cerca del máximo', { x:ml+PW-8, y:mt+PH-8, class:'qlabel', 'text-anchor':'end', 'font-family':FF });

  const xDescY = mt + PH + 38;
  tx('Posición del precio en el rango de 52 semanas (mín −100% · medio 0% · máx +100%)', {
    x: ml+PW/2, y: xDescY, fill:'#999', 'font-size':11, 'text-anchor':'middle', 'font-family':FF });
  const axisY = el('text', { x:12, y:mt+PH/2, fill:'#999', 'font-size':11, 'text-anchor':'middle',
    'font-family':FF, transform:`rotate(-90, 12, ${mt+PH/2})` });
  axisY.textContent = 'Upside al objetivo (%)';

  const titleEl = el('text', { x:W/2, y:22, 'text-anchor':'middle', 'font-size':16,
    'font-weight':700, 'font-family':FF, fill:'#f0f0f0' });
  titleEl.innerHTML = `Mapa de acciones <tspan fill="${ds.titleColor}">${ds.titleWord}</tspan> (${DATE})`;
  tx('Eje X: Posición en rango 52 semanas  |  Eje Y: Upside al objetivo  |  Color: RSI (14)  |  Línea punteada: tendencia', {
    x:W/2, y:40, 'text-anchor':'middle', 'font-size':10.5, fill:'#777', 'font-family':FF });

  /* --- Gradiente de la leyenda: verde (sobrevendido) → amarillo → rojo (sobrecomprado) --- */
  const gd = el('linearGradient', { id:'rsiGrad', x1:'0%', y1:'0%', x2:'100%', y2:'0%' }, defs);
  [{o:'0%',c:'rgb(22,163,74)'},{o:'50%',c:'rgb(250,204,21)'},{o:'100%',c:'rgb(220,38,38)'}].forEach(s => {
    const st = el('stop', { offset:s.o }, gd); st.style.stopColor = s.c;
  });

  /* --- 19.1 Burbujas de radio fijo, color por RSI --- */
  const dotsG = el('g', { 'clip-path':'url(#plot)' });
  const lblG  = el('g', {});
  DATA.forEach(d => {
    const cx = xS(xNormVal(d)), cy = yS(d.upside), r = R_FIJO, fill = rsiColor(d.rsi);
    const circ = el('circle', { cx, cy, r, fill, 'fill-opacity':0.9, stroke:'#ffffff',
      'stroke-width':1.1, 'stroke-opacity':0.6, class:'dot' }, dotsG);
    const nearRight = cx + r + 4 + d.ticker.length*7 > ml + PW;
    const lx = nearRight ? cx - r - 4 : cx + r + 4;
    const anchor = nearRight ? 'end' : 'start';
    el('rect', { x: nearRight ? lx - d.ticker.length*7.5 - 2 : lx - 2, y: cy - 9,
      width: d.ticker.length*7.5 + 6, height: 14, fill:'#0d0d0d', 'fill-opacity':0.65, rx:2 }, lblG);
    const lbl = el('text', { x: lx, y: cy+4, 'text-anchor':anchor, fill:'#f0f0f0',
      'font-size':11, 'font-weight':700, 'font-family':FF }, lblG);
    lbl.textContent = d.ticker;
    const hov = e => { lbl.setAttribute('font-size', 13); showTT(e, d); };
    const mv  = e => moveTT(e);
    const lv  = () => { lbl.setAttribute('font-size', 11); hideTT(); };
    [circ, lbl].forEach(n => { n.addEventListener('mouseenter', hov); n.addEventListener('mousemove', mv); n.addEventListener('mouseleave', lv); });
  });

  /* --- 19.2 Leyenda: única, color → RSI --- */
  const sepY = xDescY + 18;
  el('line', { x1:ml, y1:sepY, x2:ml+PW, y2:sepY, stroke:'#2a2a2a', 'stroke-width':1 });
  const R1 = sepY + 20;
  tx('Color → RSI (14)', { x:ml, y:R1+10, fill:'#666', 'font-size':10.5, 'font-weight':600, 'font-family':FF });
  el('rect', { x:ml, y:R1+18, width:PW, height:14, fill:'url(#rsiGrad)', rx:3 });
  tx('Sobrevendido (≤30)',   { x:ml,      y:R1+48, fill:'#888', 'font-size':10, 'text-anchor':'start',  'font-family':FF });
  tx('Neutro (50)',          { x:ml+PW/2, y:R1+48, fill:'#888', 'font-size':10, 'text-anchor':'middle', 'font-family':FF });
  tx('Sobrecomprado (≥70)',  { x:ml+PW,   y:R1+48, fill:'#888', 'font-size':10, 'text-anchor':'end',    'font-family':FF });

  renderNews(DATA, DATE, ds.news);
  renderLists(DATA, L);
}

/* ============ SECCIÓN 2 — NOTICIAS (Benzinga) — 19.5 ============
   Filtro |weekChange| ≥ 2%. Orden: weekChange ASCENDENTE (peor arriba). */
function renderNews(DATA, DATE, NEWS){
  const wrap = document.getElementById('news');
  if (!wrap) return;
  if (!NEWS){ wrap.innerHTML = ''; return; }
  const movers = DATA.filter(d => Math.abs(d.weekChange) >= 2 && NEWS[d.ticker])
    .sort((a,b) => a.weekChange - b.weekChange);
  let html = '<div class="news-h">¿Qué movió a cada acción esta semana?</div>'
    + '<div class="news-sub">Solo activos con variación semanal ≥ ±2% · De peor a mejor desempeño · Semana al ' + DATE + '</div>';
  movers.forEach(d => {
    const cls = d.weekChange >= 0 ? 'pos' : 'neg';
    html += '<div class="news-row"><div class="news-tk">' + d.ticker
      + '<span class="wc ' + cls + '">' + fmtPct(d.weekChange) + '</span></div>'
      + '<div class="news-tx">' + NEWS[d.ticker] + '</div></div>';
  });
  html += '<div class="news-src">Fuente: Benzinga.</div>';
  wrap.innerHTML = html;
}

/* ============ SECCIÓN 3 — LISTADOS DE POTENCIAL — 19.6 ============
   Se generan automáticamente desde ZONES. No editar a mano. */
function listTable(rows){
  if (!rows.length) return '<div class="lst-empty">Sin activos en esta zona esta semana</div>';
  let h = '<table><thead><tr><th>Ticker</th><th>Upside</th><th>Pos. rango</th><th>RSI (14)</th><th>Var. sem.</th></tr></thead><tbody>';
  rows.forEach(d => {
    const wcCls = d.weekChange >= 0 ? 'pos' : 'neg';
    const rsiTxt = d.rsi != null ? d.rsi.toFixed(1) : 'N/D';
    h += '<tr><td>' + d.ticker + '</td>'
       + '<td>' + d.upside.toFixed(2) + '%</td>'
       + '<td>' + fmtPos(d) + '</td>'
       + '<td style="color:' + rsiColor(d.rsi) + ';font-weight:600">' + rsiTxt + '</td>'
       + '<td class="' + wcCls + '">' + fmtPct(d.weekChange) + '</td></tr>';
  });
  return h + '</tbody></table>';
}
function renderLists(DATA, L){
  const wrap = document.getElementById('lists');
  if (!wrap) return;
  const buys  = DATA.filter(inBuy).sort((a,b) => b.upside - a.upside);
  const sells = DATA.filter(inSell).sort((a,b) => a.upside - b.upside);
  wrap.innerHTML =
      '<div class="lst">'
    +   '<div class="lst-h"><span class="dotmark" style="background:' + ZONES.buy.color + '"></span>' + L.lbuy + '</div>'
    +   '<div class="lst-crit">' + ZONES.buy.crit + '</div>'
    +   listTable(buys)
    + '</div>'
    + '<div class="lst">'
    +   '<div class="lst-h"><span class="dotmark" style="background:' + ZONES.sell.color + '"></span>' + L.lsell + '</div>'
    +   '<div class="lst-crit">' + ZONES.sell.crit + '</div>'
    +   listTable(sells)
    + '</div>';
}

/* ====================== TOOLTIP ====================== */
const tt = document.getElementById('tooltip');
function showTT(e, d){
  const wc = d.weekChange >= 0 ? `<span class="pos">+${d.weekChange.toFixed(2)}%</span>` : `<span class="neg">${d.weekChange.toFixed(2)}%</span>`;
  tt.innerHTML = `
    <div class="tt">${d.ticker}</div>
    <div class="tn">${d.name}</div>
    <div class="tr">Precio actual: <b>$${d.price.toLocaleString('en-US')}</b></div>
    <div class="tr">Precio objetivo: <b>$${d.target.toLocaleString('en-US',{maximumFractionDigits:2})}</b></div>
    <div class="tr">Upside objetivo: <b>${d.upside.toFixed(2)}%</b></div>
    <div class="tr">Var. semanal: <b>${wc}</b></div>
    <div class="tr">Mín 52s: <b>$${d.low52 != null ? d.low52.toLocaleString('en-US',{maximumFractionDigits:2}) : 'N/D'}</b></div>
    <div class="tr">Máx 52s: <b>$${d.high52 != null ? d.high52.toLocaleString('en-US',{maximumFractionDigits:2}) : 'N/D'}</b></div>
    <div class="tr">Posición en rango: <b>${fmtPos(d)}</b></div>
    <div class="tr">RSI (14): <b>${d.rsi != null ? d.rsi.toFixed(1) : 'N/D'}</b></div>
    <div class="tr">Ratio P/E: <b>${d.pb ? d.pb.toFixed(1) : 'N/D'}</b></div>
    <div class="tr">Rating: <b>${d.rating}</b></div>`;
  tt.style.display = 'block';
  moveTT(e);
}
function moveTT(e){
  const x = e.clientX + 14, y = e.clientY - 10;
  const tw = tt.offsetWidth, th = tt.offsetHeight;
  tt.style.left = (x+tw > window.innerWidth ? e.clientX-tw-14 : x) + 'px';
  tt.style.top  = (y+th > window.innerHeight ? e.clientY-th-10 : y) + 'px';
}
function hideTT(){ tt.style.display = 'none'; }

/* ====================== PESTAÑAS ====================== */
const tabsEl = document.getElementById('tabs');
function selectTab(key){
  TAB_ORDER.forEach(k => {
    const b = document.getElementById('tab-'+k);
    const on = k === key;
    b.classList.toggle('active', on);
    b.style.borderBottomColor = on ? DATASETS[k].titleColor : 'transparent';
  });
  hideTT();
  renderChart(DATASETS[key], key);
}
TAB_ORDER.forEach(k => {
  const b = document.createElement('button');
  b.id = 'tab-'+k; b.className = 'tab'; b.textContent = DATASETS[k].label;
  b.addEventListener('click', () => selectTab(k));
  tabsEl.appendChild(b);
});
selectTab(TAB_ORDER[0]);
</script>
